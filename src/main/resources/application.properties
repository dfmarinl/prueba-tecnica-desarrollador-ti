spring.application.name=api-polizas

# Base de datos H2 en memoria (datos de demostracion al iniciar)
spring.datasource.url=jdbc:h2:mem:polizas;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=false

# API key de prueba tecnica (no usar en produccion)
app.api-key=123456

# IPC demostrativo: valor de ejemplo para la prueba tecnica,
# NO representa el IPC real vigente. Sobreescribir con APP_IPC_PORCENTAJE.
app.ipc.porcentaje=1.5
